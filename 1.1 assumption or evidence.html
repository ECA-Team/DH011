<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assumption or Evidence?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dee5eb;color:#182d40;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}main{max-width:960px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 20px}#items{display:grid;gap:14px}.item{background:#9cbad4;padding:18px 20px;border-radius:10px}.statement{margin:0 0 12px;font-size:17px}.choices{display:flex;flex-wrap:wrap;gap:10px}label{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid #435e74;background:#dee5eb;border-radius:6px;cursor:pointer}label:has(input:checked){background:#182d40;color:#fff;border-color:#182d40}input{accent-color:#182d40;width:18px;height:18px;margin:0}button{font:inherit;min-height:44px;border:1px solid #182d40;border-radius:6px;padding:10px 20px;cursor:pointer;background:#182d40;color:white}button.secondary{background:#dee5eb;color:#182d40}button:focus-visible,input:focus-visible{outline:3px solid #182d40;outline-offset:4px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.feedback{margin:12px 0 0;padding-top:10px;border-top:1px solid #435e74}.feedback:empty{display:none}#result{font-weight:bold;margin:16px 0 0}#result:empty{display:none}fieldset{margin:0;padding:0;border:0;min-width:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:480px){main{padding:16px}.item{padding:16px}h1{font-size:23px}label{flex:1;justify-content:center;padding:8px}.statement{font-size:16px}}
</style>
</head>
<body><main>
<h1>Assumption or Evidence?</h1>
<form id="activity"><div id="items"></div>
<div class="actions"><button type="submit">Check Answers</button><button type="button" class="secondary" id="reset">Reset</button></div>
<p id="result" role="status" aria-live="polite" aria-atomic="true"></p>
</form></main>
<script>
(()=>{
const data=[
['Patients are unhappy because the waiting room looks crowded.','Assumption','The statement infers how patients feel and what causes their dissatisfaction without supporting data.'],
['Survey results show that satisfaction decreases when waiting time exceeds 60 minutes.','Evidence','The statement reports a finding from survey results.'],
['Sales are low because customers do not like the product.','Assumption','The statement proposes a reason for low sales without supporting data about customer preferences.'],
['Sales reports show a 15% decrease in one region.','Evidence','The statement reports a measurable finding from sales reports.'],
['Staff seem busy, so the service must be underperforming.','Assumption','The statement draws a conclusion about service performance from an impression of staff activity.'],
['Appointment data shows Monday has the highest number of patients.','Evidence','The statement reports a pattern found in appointment data.']
];
const items=document.getElementById('items'),form=document.getElementById('activity'),result=document.getElementById('result');
data.forEach(([statement],i)=>{const card=document.createElement('fieldset');card.className='item';const legend=document.createElement('legend');legend.className='sr-only';legend.textContent='Statement '+(i+1);card.append(legend);const p=document.createElement('p');p.className='statement';p.id='statement-'+i;p.textContent=statement;card.append(p);const choices=document.createElement('div');choices.className='choices';choices.setAttribute('role','radiogroup');choices.setAttribute('aria-labelledby',p.id);['Assumption','Evidence'].forEach(answer=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='answer-'+i;input.value=answer;label.append(input,document.createTextNode(answer));choices.append(label)});card.append(choices);const feedback=document.createElement('p');feedback.className='feedback';feedback.id='feedback-'+i;card.append(feedback);items.append(card)});
form.addEventListener('submit',event=>{event.preventDefault();const selected=data.map((_,i)=>form.querySelector('input[name="answer-'+i+'"]:checked'));const missing=selected.filter(x=>!x).length;if(missing){result.textContent=missing+' statement'+(missing===1?' remains':'s remain')+' unclassified.';form.querySelector('input[name="answer-'+selected.findIndex(x=>!x)+'"]').focus();return}let score=0;data.forEach(([,answer,explanation],i)=>{const correct=selected[i].value===answer;if(correct)score++;document.getElementById('feedback-'+i).textContent=(correct?'Correct. ':'Incorrect. Correct answer: '+answer+'. ')+explanation});result.textContent=score+' of '+data.length+' correct.'+(score===data.length?' All statements correctly classified.':'');});
form.addEventListener('change',()=>{result.textContent='';items.querySelectorAll('.feedback').forEach(p=>p.textContent='')});
document.getElementById('reset').addEventListener('click',()=>{form.reset();items.querySelectorAll('.feedback').forEach(p=>p.textContent='');result.textContent='Activity reset.';form.querySelector('input').focus()});
})();
</script></body></html>
